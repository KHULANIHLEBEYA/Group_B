name: CSRMS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend check and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Production build
        run: pnpm build

  django:
    name: Django checks (when backend is present)
    if: ${{ hashFiles('**/manage.py') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install backend dependencies
        shell: bash
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          elif [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          else
            echo "No requirements file found; Django dependency installation was skipped."
          fi

      - name: Run Django system checks
        shell: bash
        run: |
          MANAGE_FILE=$(find . -name manage.py -print -quit)
          if [ -z "$MANAGE_FILE" ]; then
            echo "No manage.py found; Django checks were skipped."
            exit 0
          fi
          cd "$(dirname "$MANAGE_FILE")"
          python manage.py check
