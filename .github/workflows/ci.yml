name: CSRMS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend check and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Production build
        run: pnpm build

  django:
    name: Django checks when backend is present
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Django backend
        id: detect
        shell: bash
        run: |
          MANAGE_FILE=$(find . -name manage.py -print -quit)
          if [ -n "$MANAGE_FILE" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "manage_file=$MANAGE_FILE" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No manage.py found; Django checks will be skipped."
          fi

      - name: Setup Python
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install backend dependencies
        if: steps.detect.outputs.present == 'true'
        shell: bash
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          elif [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          else
            echo "No requirements file found; Django dependency installation was skipped."
          fi

      - name: Run Django system checks
        if: steps.detect.outputs.present == 'true'
        shell: bash
        run: |
          cd "$(dirname "${{ steps.detect.outputs.manage_file }}")"
          python manage.py check
